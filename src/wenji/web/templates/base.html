<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name or "wenji" }} Knowledge Engine{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=2.8">
  <meta name="description" content="{% block description %}{{ site_name or "wenji" }} — 中文 markdown 知識搜尋引擎。{% endblock %}">
  <meta name="robots" content="index, follow">
  {% block extra_meta %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="/" class="brand">{{ site_name or "wenji" }}</a>
      <nav class="nav-links">
        <a class="nav-item" href="/tags">標籤總覽</a>
        <a class="nav-item" id="nav-ask" href="/ask">自由問答</a>
        <a class="nav-item" href="/aggregate">文章彙整</a>
      </nav>
    </div>
    
    {% block search_mini %}
    {% if query or tag or source_type or year %}
    <form action="/" method="get" class="search-form" id="search-form-mini">
      <input type="search" name="q" value="{{ query|e }}" placeholder="搜尋知識..." required>
      <button type="submit">搜尋</button>
    </form>
    {% endif %}
    {% endblock %}

    <div class="topbar-right">
      <div class="font-controls" style="position: static; margin-right: 1rem;">
        <button class="font-btn" data-size="0.85" title="小">小</button>
        <button class="font-btn active" data-size="1.0" title="中">中</button>
        <button class="font-btn" data-size="1.2" title="大">大</button>
      </div>
      <span class="bookmark-count-wrapper" onclick="var p=document.querySelector('.bookmark-list-panel'); p.open=!p.open;" style="margin-left: 0;">
        ♥ <span class="bookmark-count-badge">0</span>
      </span>
    </div>
  </header>

  <div id="main-content">
    {% block content %}{% endblock %}
  </div>

  <script>
    // 自由問答帶著當前搜尋詞過去：點擊當下讀任一搜尋框的值改寫 href。
    (function () {
      var ask = document.getElementById('nav-ask');
      if (!ask) return;
      ask.addEventListener('click', function () {
        // 限定搜尋表單：/ask 頁的問答 textarea 也叫 name="q"，不能誤抓
        var box = document.querySelector('.search-form input[name="q"]');
        var t = box && box.value ? box.value.trim() : '';
        ask.href = t ? '/ask?q=' + encodeURIComponent(t) : '/ask';
      });
    })();
    (function () {
      var s = localStorage.getItem('wenji_font_size') || '1.0';
      document.documentElement.style.setProperty('--font-scale', s);
      document.querySelectorAll('.font-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.size === s);
      });
      document.querySelectorAll('.font-btn').forEach(function (b) {
        b.onclick = function () {
          var v = b.dataset.size;
          document.documentElement.style.setProperty('--font-scale', v);
          localStorage.setItem('wenji_font_size', v);
          document.querySelectorAll('.font-btn').forEach(function (x) { x.classList.toggle('active', x.dataset.size === v); });
        };
      });
    })();
  </script>
  {% include "_bookmark_script.html" %}
  {% block scripts %}{% endblock %}
</body>
</html>
